<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=628">
    <title>Crabigator Ad - Horizontal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0f1a 0%, #131b2e 50%, #0d1321 100%);
            color: #fff;
            width: 1200px;
            height: 628px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 70px;
        }

        .text-content {
            flex: 1;
            padding-right: 50px;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 179, 237, 0.15);
            border: 1px solid rgba(99, 179, 237, 0.3);
            color: #63b3ed;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .highlight {
            background: linear-gradient(135deg, #63b3ed 0%, #4fd1c5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 20px;
            color: #a0aec0;
            line-height: 1.5;
            margin-bottom: 28px;
            max-width: 480px;
        }

        .cta-box {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 16px 28px;
        }

        .free-tag {
            background: #238636;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .cta-text {
            font-size: 18px;
            font-weight: 600;
            color: #e6edf3;
        }

        .cta-price {
            color: #4fd1c5;
            font-size: 22px;
            font-weight: 700;
        }

        .phone-mockup {
            width: 220px;
            height: 440px;
            background: #1a1a2e;
            border-radius: 36px;
            border: 4px solid #2d3748;
            padding: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #0d1117;
            border-radius: 26px;
            padding: 16px 12px;
            overflow: hidden;
        }

        .phone-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #21262d;
        }

        .phone-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #238636;
        }

        .phone-title {
            font-size: 12px;
            font-weight: 600;
            color: #e6edf3;
        }

        .permission-card {
            background: #161b22;
            border: 1px solid #f0883e;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .permission-label {
            font-size: 9px;
            color: #f0883e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .permission-text {
            font-size: 10px;
            color: #e6edf3;
            margin-bottom: 6px;
        }

        .permission-code {
            font-family: 'SF Mono', Monaco, monospace;
            background: #0d1117;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 9px;
            color: #79c0ff;
            margin-bottom: 10px;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            border: none;
        }

        .btn-allow { background: #238636; color: white; }
        .btn-deny { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }

        .stats-row {
            display: flex;
            gap: 6px;
        }

        .stat {
            flex: 1;
            background: #161b22;
            border-radius: 6px;
            padding: 10px 4px;
            text-align: center;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 8px;
            color: #7d8590;
            text-transform: uppercase;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-content">
            <div class="badge">Claude Code + Mobile</div>
            <h1>Control <span class="highlight">Claude Code</span><br>From Your Phone</h1>
            <p class="subtitle">Answer permissions, approve plans, and respond to Claude—anywhere you are. No VPN needed.</p>
            <div class="cta-box">
                <span class="free-tag">Free Tier</span>
                <span class="cta-text">Pro unlimited</span>
                <span class="cta-price">$3/mo</span>
            </div>
        </div>

        <div class="phone-mockup">
            <div class="phone-screen">
                <div class="phone-header">
                    <div class="phone-dot"></div>
                    <span class="phone-title">Crabigator</span>
                </div>

                <div class="permission-card">
                    <div class="permission-label">Permission</div>
                    <div class="permission-text">Claude wants to run:</div>
                    <div class="permission-code">npm run deploy</div>
                    <div class="btn-row">
                        <button class="btn btn-allow">Allow</button>
                        <button class="btn btn-deny">Deny</button>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat">
                        <div class="stat-value">18m</div>
                        <div class="stat-label">Session</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">12</div>
                        <div class="stat-label">Prompts</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">47</div>
                        <div class="stat-label">Tools</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
